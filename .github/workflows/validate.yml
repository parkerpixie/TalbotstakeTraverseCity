name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check copy-polish.js
      - run: node --check navigation-ux.js
      - run: node --check family-rating-queue.js
      - run: node --check porter-place-additions.js
      - run: node --check phase-a-explore-metadata.js
      - run: node --check plan-trip.js
      - run: node --check mani-guide.js
      - run: node --check trip-companion-overhaul.js
      - run: cat trip-companion-overhaul.part-*.txt > /tmp/trip-companion-overhaul.js && node --check /tmp/trip-companion-overhaul.js
      - run: test -f plan-trip.css && test -f mani-guide.css
      - run: test -f trip-companion-overhaul.css
      - run: test -f "Assets/Raven HIll Discovery Center.jpeg" && test -f "Assets/Boardman Nature River Center.jpeg"
      - run: test -f "Assets/Mani-Guide.png" && test -f "Assets/Mani-Thinking.png" && test -f "Assets/Mani-Nearby.png" && test -f "Assets/Mani-Warning.png" && test -f "Assets/Mani-Celebrate.png" && test -f "Assets/Mani-Rainy-Day.png" && test -f "Assets/Mani-Schedule.png"
      - run: test -f brand-overhaul.css && test -f brand-refresh.css && test -f brand-refresh.js && test -f index.html
