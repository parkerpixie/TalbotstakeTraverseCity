name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check copy-polish.js
      - run: node --check navigation-ux.js
      - run: test -f brand-overhaul.css && test -f brand-refresh.css && test -f brand-refresh.js && test -f index.html
